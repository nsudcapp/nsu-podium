<!-- Scripts -->

<!-- Official Supabase JS Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Direct Supabase Client -->
<script>
  const PODIUM_SUPABASE_URL =
    "https://tgqftmluyhuxikeoaglp.supabase.co";

  const PODIUM_SUPABASE_KEY =
    "sb_publishable_EfuSu4ppSHtigQPrXjB4vA_0aWelCj6";

  let podiumSupabaseClient = null;

  function getSupabaseClient() {

    if (podiumSupabaseClient) {
      return podiumSupabaseClient;
    }

    if (
      !window.supabase ||
      typeof window.supabase.createClient !== "function"
    ) {
      console.error("[Supabase] Supabase library failed to load.");
      return null;
    }

    try {
      podiumSupabaseClient = window.supabase.createClient(
        PODIUM_SUPABASE_URL,
        PODIUM_SUPABASE_KEY
      );

      window.supabaseClient = podiumSupabaseClient;

      console.log(
        "[Supabase] Client ready:",
        PODIUM_SUPABASE_URL
      );

      return podiumSupabaseClient;

    } catch (error) {
      console.error(
        "[Supabase] Client initialization failed:",
        error
      );

      return null;
    }
  }

  window.getSupabaseClient = getSupabaseClient;

  getSupabaseClient();
</script>

<!-- Storage and Registration Service -->
<script src="/js/storage.js"></script>

<!-- Main Application Controller -->
<script src="/js/app.js"></script>
