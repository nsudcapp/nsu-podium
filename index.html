<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NSU PODIUM 2026 | DEBATE. COMPETE. LEVEL UP.</title>
  <meta name="description"
    content="Official NSU PODIUM 2026 Retro-Arcade Platform. Debate. Compete. Level Up. Organized by NSUDC — North South University Debate Club.">

  <!-- Favicon (Square Optimized NSU PODIUM 2026 Logo) -->
  <link rel="icon" type="image/png" href="favicon.png?v=2">

  <!-- Google Fonts: Press Start 2P, Chakra Petch, JetBrains Mono -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Press+Start+2P&display=swap"
    rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

  <!-- Retro Grid & Dot Pattern Background -->

  <div class="retro-grid-bg" aria-hidden="true"></div>

  <div class="arcade-page-wrapper">

    <!-- Top Brand Bar with Provided NSU PODIUM Logo -->
    <header class="brand-marquee-header">
      <a href="index.html" class="brand-marquee-logo-link" aria-label="NSU PODIUM 2026 Home">
        <img src="logo.png" alt="NSU PODIUM 2026 Logo"
          class="brand-marquee-logo-img" loading="eager">
      </a>

      <div class="brand-marquee-badge">
        NSUDC • OFFICIAL
      </div>
    </header>

    <!-- Main Arcade Cabinet Screen -->
    <main class="arcade-screen-container" id="arenaScreen">

      <!-- 1. Top Arcade Status Bar -->
      <div class="arcade-status-bar">
        <span class="status-item one-up">1UP</span>
        <span class="status-item high-score">HIGH SCORE</span>
        <span class="status-item credit">CREDIT 01</span>
      </div>

      <!-- 2. Big 3D Pixel Title -->
      <div class="arcade-title-box">
        <h1 class="arcade-main-title">NSU PODIUM</h1>

        <!-- Subtitle -->
        <p class="arcade-tagline">
          <span class="tagline-dot">•</span>
          <span>DEBATE. COMPETE. LEVEL UP.</span>
          <span class="tagline-dot">•</span>
        </p>
      </div>

      <!-- 3. Winners' Podium -->
      <section class="arcade-podium-section" aria-label="Winners Podium">

        <!-- Step 2 (Left): Blue Pedestal with Cyan Ghost -->
        <div class="podium-pillar step-2">
          <div class="podium-character-wrap">

            <svg class="arcade-ghost-svg" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"
              aria-label="Cyan Ghost">
              <!-- Ghost Body -->
              <path d="M4 14C4 7.37 9.37 2 16 2C22.63 2 28 7.37 28 14V28L24 24L20 28L16 24L12 28L8 24L4 28V14Z"
                fill="#00f0ff" />

              <!-- Ghost White Eyes -->
              <rect x="8" y="10" width="5" height="7" rx="1.5" fill="#ffffff" />
              <rect x="19" y="10" width="5" height="7" rx="1.5" fill="#ffffff" />

              <!-- Ghost Blue Pupils -->
              <rect x="11" y="12" width="3" height="4" fill="#0033aa" />
              <rect x="22" y="12" width="3" height="4" fill="#0033aa" />
            </svg>

          </div>

          <div class="podium-block">2</div>
        </div>

        <!-- Step 1 (Center): Tall Gold Pedestal with Golden Orb -->
        <div class="podium-pillar step-1">
          <div class="podium-character-wrap">
            <div class="gold-orb" aria-label="Gold Champion Orb"></div>
          </div>

          <div class="podium-block">1</div>
        </div>

        <!-- Step 3 (Right): Purple/Pink Pedestal with Pink Ghost -->
        <div class="podium-pillar step-3">
          <div class="podium-character-wrap">

            <svg class="arcade-ghost-svg" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"
              aria-label="Pink Ghost">
              <!-- Ghost Body -->
              <path d="M4 14C4 7.37 9.37 2 16 2C22.63 2 28 7.37 28 14V28L24 24L20 28L16 24L12 28L8 24L4 28V14Z"
                fill="#f472b6" />

              <!-- Ghost White Eyes -->
              <rect x="8" y="10" width="5" height="7" rx="1.5" fill="#ffffff" />
              <rect x="19" y="10" width="5" height="7" rx="1.5" fill="#ffffff" />

              <!-- Ghost Pupils -->
              <rect x="9" y="12" width="3" height="4" fill="#880055" />
              <rect x="20" y="12" width="3" height="4" fill="#880055" />
            </svg>

          </div>

          <div class="podium-block">3</div>
        </div>

      </section>

      <!-- 4. Register Button -->
      <div>
        <a href="register.html" class="arcade-btn-yellow" id="registerNowBtn">
          Register now
        </a>
      </div>

    </main>

    <!-- Footer -->
    <footer class="arcade-page-footer">
      <p class="arcade-footer-text">
        &copy; 2026 NSU PODIUM • NSUDC — North South University Debate Club
      </p>
    </footer>

  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/storage.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
